# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json

configuration:
  pageTitle: SteamMatchingApp
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true

  analytics:
    provider: plausible

  locale: ja-JP
  baseUrl: steam-matching-daily-log.pages.dev

  ignorePatterns:
    - private
    - templates
    - .obsidian

  theme:
    fontOrigin: googleFonts
    cdnCaching: true

    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono

    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"

      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"

plugins:
  # 更新日時
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  # コードブロックのシンタックスハイライト
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  # Obsidian Markdown対応
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30

  # GitHub Flavored Markdown
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40

  # ページ内目次
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30

  # Markdownリンク / Wikilink
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  # ページ説明
  - source: "@quartz-community/description"
    enabled: true
    order: 70

  # 改行処理
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90

  # Quartzフォント
  - source: "@quartz-community/quartz-fonts"
    enabled: true

  # テーマ
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: default
      mode: both

  # draftを除外
  - source: "@quartz-community/remove-draft"
    enabled: true

  # サイトマップ / RSS
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  # favicon
  - source: "@quartz-community/favicon"
    enabled: true

  # Markdownページ
  - source: "@quartz-community/content-page"
    enabled: true

  # フォルダページ
  - source: "@quartz-community/folder-page"
    enabled: true

  # 左側のファイル / フォルダ一覧
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50

  # 検索
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  # 記事タイトル
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  # ページメタ情報
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20

  # サイトタイトル
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10

  # ダークモード
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  # リーダーモード
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  # パンくずリスト
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  # フッター
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50

  # モバイル用スペーサー
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem

  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []

    content: {}

    folder:
      exclude:
        - reader-mode
      positions:
        right: []

    tag:
      exclude:
        - reader-mode
      positions:
        right: []

    canvas: {}

    bases: {}